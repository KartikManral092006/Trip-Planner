[project]
name = "travel-planner"
version = "1.0.0"
description = "Multi-agent AI travel planner with code-checked budgets and human approval"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "langchain>=1.4.7",
    "langchain-core>=1.6.13",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
